<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dominó SEOSP — Placar Oficial</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<meta name="theme-color" content="#1E3A2A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dominó SEOSP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--got:#7A5A14;--og:#B8892B;--gd:#1E3A2A;--gd2:#2A4D38;--go:#B8892B;--gl:#D9B45A;--iv:#FBF6EA;--pn:#F4ECD8;--tc:#A84B2A;--oc:#C9962B;--tx:#2E2218;--mu:#6B5A48;--ln:#E3D3AE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--pn);color:var(--tx);font-family:'Source Sans 3',system-ui,sans-serif;font-size:16px}
button,input,select{font:inherit;color:inherit}
header{background:var(--gd);color:var(--iv);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--go);position:sticky;top:0;z-index:5}
header img{width:44px;height:44px;border-radius:50%;background:var(--iv);padding:2px;border:2px solid var(--gl)}
header .t1{font-family:Cinzel,serif;font-size:20px;letter-spacing:2px;line-height:1}
header .t2{font-family:Montserrat,sans-serif;font-size:10.5px;letter-spacing:2.5px;color:var(--gl);margin-top:3px}
#sync{margin-left:auto;font-size:12px;color:var(--gl);text-align:right}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--gd);border-top:3px solid var(--go);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav a{flex:1;min-width:0;text-align:center;color:#CFC3A5;text-decoration:none;padding:9px 1px 8px;font-family:Montserrat,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.2px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
nav a svg{width:22px;height:22px}
nav a.on{color:var(--gl)}
h2{font-family:Montserrat,sans-serif;font-size:13px;letter-spacing:2.5px;color:var(--gd);margin:18px 0 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--go)}
h2:first-child{margin-top:4px}
.card{background:var(--iv);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.btn{border:0;border-radius:10px;padding:12px 16px;min-height:46px;font-family:Montserrat,sans-serif;font-weight:700;font-size:14px;letter-spacing:.5px;cursor:pointer;background:var(--gd);color:var(--iv)}
.btn.gold{background:var(--og);color:#2E2218}
.btn.tc{background:var(--tc);color:#fff}
.btn.ghost{background:transparent;color:var(--gd);border:1.5px solid var(--gd)}
.btn.sm{min-height:44px;padding:8px 14px;font-size:13.5px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
label.f{display:block;font-size:13px;font-weight:700;color:var(--mu);margin:10px 0 4px}
input[type=text],select{width:100%;padding:11px 12px;border:1.5px solid var(--ln);border-radius:10px;background:#fff;min-height:46px}
input:focus,select:focus{outline:2px solid var(--og);border-color:var(--og)}
summary{padding:10px 0;min-height:24px;cursor:pointer}
input,select{min-height:44px;box-sizing:border-box}
.btn.sm{min-width:44px}
button:focus-visible,a:focus-visible,summary:focus-visible,[data-ficha]:focus-visible,[data-extrato]:focus-visible{outline:3px solid var(--og);outline-offset:2px}
.muted{color:var(--mu);font-size:13.5px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;font-family:Montserrat,sans-serif;letter-spacing:.3px}
.banner{border-radius:10px;padding:10px 12px;font-weight:700;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.banner.gold{background:#F3E2B5;color:#5B4310;border:1px solid var(--gl)}
.banner.tc{background:#F5D9CC;color:#6E2A14;border:1px solid #D9A089}
.banner.gd{background:#DCE8DA;color:var(--gd);border:1px solid #A9C2A3}
/* scoreboard */
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.side{border-radius:14px;padding:14px 12px;color:var(--iv);position:relative;overflow:hidden}
.side.A{background:var(--gd)}
.side.B{background:var(--tc)}
.side.win{box-shadow:0 0 0 3px var(--gl),0 0 0 5px var(--go)}
.side .nm{font-family:Montserrat,sans-serif;font-weight:800;font-size:15px;letter-spacing:.5px;line-height:1.15;word-break:break-word}
.side .pl{font-size:12.5px;opacity:.88;margin-top:2px;min-height:16px}
.side .pts{font-family:Montserrat,sans-serif;font-weight:800;font-size:52px;line-height:1;margin-top:10px}
.side .pts small{font-size:13px;letter-spacing:1.5px;font-weight:700;margin-left:4px;opacity:.85}
.track{display:flex;gap:6px;margin-top:8px}
.track i{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.22)}
.track i.on{background:var(--gl)}
.pecas{margin-top:10px;font-family:Montserrat,sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.tile{display:inline-block;width:14px;height:24px;border-radius:3px;background:var(--iv);border:1.5px solid var(--gl);position:relative}
.tile::after{content:"";position:absolute;left:2px;right:2px;top:50%;height:1.5px;background:var(--gd)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.actions .btn{min-height:56px;font-size:15px}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dotted #D9C9A8;font-size:14px;align-items:flex-start}
.log li:last-child{border-bottom:0}
.log .n{font-family:Montserrat,sans-serif;font-weight:800;color:var(--got);min-width:24px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;margin-top:5px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(30,30,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--pn);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));border-top:4px solid var(--go)}
.sheet h3{font-family:Montserrat,sans-serif;font-size:15px;letter-spacing:1.5px;margin:0 0 4px;color:var(--gd)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.opt{border:1.5px solid var(--ln);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;min-height:58px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:14.5px}
.opt span{font-size:12px;color:var(--mu)}
.opt.sel{border-color:var(--got);box-shadow:0 0 0 2px var(--go);background:#FFF9EA}
.opt.full{grid-column:1/-1}
.grp{font-family:Montserrat,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:1.5px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:Montserrat,sans-serif;font-size:11px;letter-spacing:1px;text-align:left;color:var(--gd);border-bottom:2px solid var(--gd);padding:7px 6px}
td{padding:9px 6px;border-bottom:1px solid var(--ln)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.rank{font-family:Montserrat,sans-serif;font-weight:800;color:var(--got)}
.scroll{overflow-x:auto}
.seg{display:flex;background:#E9DEC4;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 6px;font-weight:700;font-size:13px;min-height:40px;cursor:pointer}
.seg button.on{background:var(--gd);color:var(--iv)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--tx);color:var(--iv);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw}
.match{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.match:last-child{border-bottom:0}
.rg{padding:0;margin-bottom:8px}.rg summary{padding:12px 14px;font-weight:700;color:var(--gd);cursor:pointer;list-style:none}.rg summary::after{content:"▸";float:right;color:var(--got)}.rg[open] summary::after{content:"▾"}.rg .rules{padding:0 14px 10px}
.gl p{margin:5px 0;font-size:14px}
.gprot{margin-top:12px;padding-top:10px;border-top:1px solid var(--ln)}
.doc{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--ln);color:var(--tx);text-decoration:none;font-size:20px}.doc:last-child{border-bottom:0}
.doc span{flex:1;display:flex;flex-direction:column;font-size:15px}.doc small{font-size:12.5px;color:var(--mu)}
.hx{padding:8px 0;border-bottom:1px dashed var(--ln);font-size:14px}.hx:last-child{border-bottom:0}
.inst{display:flex;align-items:center;gap:8px;background:#E9F0E4;border:1px solid #CADBC1;border-radius:12px;padding:8px 10px;margin-bottom:12px;font-size:13.5px;line-height:1.35}.inst span{flex:1}
.mc{background:var(--iv);border:1px solid var(--ln);border-radius:12px;padding:10px 12px 6px;margin:0 0 10px;cursor:pointer;box-shadow:0 2px 6px rgba(46,34,24,.05)}
.mc:active{transform:scale(.99)}
.mc-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu);margin-bottom:4px;flex-wrap:wrap}
.mc-top .tag{background:var(--pn);border-radius:6px;padding:1px 6px;font-weight:600}
.mc-top .pill{margin-left:auto;font-size:11px;padding:2px 8px}
.mc-top .un{font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-family:Montserrat,sans-serif;font-weight:700;min-width:44px;text-align:right}
.mc-top .pill+.un{margin-left:0}.mc-top .tag+.un{margin-left:auto}
.mc-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.mc-row+.mc-row{border-top:1px dashed var(--ln)}
.mc-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:600;color:var(--tx)}
.mc-row.win .nm{font-weight:800;color:var(--gd)}
.mc-row .sc{font-family:Montserrat,sans-serif;font-weight:800;font-size:20px;min-width:30px;text-align:right;color:var(--mu)}
.mc-row.win .sc{color:var(--got)}
.dv{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dv.lib{background:#1E3A2A;box-shadow:0 0 0 2px #D9B45A}
.dv.sul{background:#5E7F4F}
.dv.g{background:#1E3A2A;box-shadow:0 0 0 2px #D9B45A}.dv.int{background:#5E7F4F}.dv.meio{background:#D8CBAA}.dv.lan{background:#C9704A}
.tb tr.zg td:first-child{box-shadow:inset 4px 0 #D9B45A}.tb tr.zint td:first-child{box-shadow:inset 4px 0 #5E7F4F}.tb tr.zmeio td:first-child{box-shadow:inset 4px 0 #D8CBAA}
.tb tr.zlan td{background:#F7E1D5}.tb tr.zlan td:first-child{box-shadow:inset 4px 0 #C9704A}.tb tr.zlan td.n::after{content:" 🔦";font-size:12px}
.tb tr.zg+tr.zint td,.tb tr.zint+tr.zmeio td,.tb tr.zmeio+tr.zlan td,.tb tr.zg+tr.zmeio td,.tb tr.zint+tr.zlan td,.tb tr.zg+tr.zlan td{border-top:2px dashed #CDBB8F}
.dvleg{display:flex;gap:14px;align-items:center;font-size:12.5px;margin:0 2px 8px;flex-wrap:wrap}
.tb tr.rlib td:first-child{box-shadow:inset 4px 0 #D9B45A}
.tb tr.rsul td:first-child{box-shadow:inset 4px 0 #5E7F4F}
.vs{font-family:Montserrat,sans-serif;font-weight:800;font-size:12px;color:var(--got)}
.rules p{margin:6px 0;font-size:14.5px;line-height:1.45}
.rules h4{font-family:Montserrat,sans-serif;font-size:12px;letter-spacing:1.5px;margin:14px 0 4px;color:var(--gd)}
.empty{text-align:center;padding:22px 10px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:12px;background:#EFE4CC;border-radius:999px;padding:3px 9px}
.chip b{color:var(--tc)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.sd{border-radius:14px;padding:10px;color:#fff}
.sd.A{background:var(--gd)}.sd.B{background:var(--tc)}
.sd .t{font-family:Montserrat,sans-serif;font-size:11px;font-weight:800;letter-spacing:2px;opacity:.85;margin-bottom:6px}
.slot{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;min-height:44px;border-radius:10px;border:1.5px dashed rgba(255,255,255,.55);background:rgba(255,255,255,.08);color:#fff;padding:6px 10px;margin-top:6px;font-weight:700;font-size:14.5px;text-align:left;cursor:pointer}
.slot.ok{border-style:solid;background:rgba(255,255,255,.18)}
.slot.foco{border-color:#D9B45A;box-shadow:0 0 0 2px #D9B45A}
.slot .x{opacity:.8;font-size:13px}
.chipsJ{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.cj{border:1.5px solid var(--ln);background:#fff;color:var(--tx);border-radius:999px;min-height:40px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer}
.cj.A{background:var(--gd);border-color:var(--gd);color:#fff}.cj.B{background:var(--tc);border-color:var(--tc);color:#fff}
.cj.dp{border-color:#B8892B;background:#FFF9EA}
.sticky{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--pn);padding:10px 0 4px;margin-top:8px;border-top:1px solid var(--ln)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pbtn{border:0;border-radius:14px;min-height:66px;padding:10px 12px;color:#fff;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px}
.pbtn b{font-size:16px;line-height:1.15}.pbtn span{font-size:11.5px;opacity:.85;font-family:Montserrat,sans-serif;font-weight:700;letter-spacing:1px}
.pbtn.A{background:var(--gd)}.pbtn.B{background:var(--tc)}
.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{font-family:Montserrat,sans-serif;font-size:11.5px;letter-spacing:.5px;color:var(--mu);text-align:center;padding:6px 2px;border-bottom:2px solid var(--gd)}
.tb th:nth-child(2){text-align:left}
.tb td{padding:12px 2px;border-bottom:1px solid var(--ln);text-align:center;font-variant-numeric:tabular-nums}
.tb td.n{text-align:left;font-weight:700;line-height:1.2}
.tb td.p{font-family:Montserrat,sans-serif;font-weight:800;font-size:15px;color:var(--gd)}
.tb td.neg{color:var(--tc);font-weight:700}
.tb tr.g1 td:first-child{color:#B8892B}.tb td:first-child{font-family:Montserrat,sans-serif;font-weight:800;color:var(--mu)}
.tb tr:nth-child(-n+3) td.n{color:var(--gd)}
.div{border-radius:14px;overflow:hidden;margin-bottom:14px;border:1px solid var(--ln);background:var(--iv)}
.div .hd{padding:12px 14px;color:#fff;display:flex;align-items:center;gap:10px}
.div .hd b{font-family:Montserrat,sans-serif;font-size:15px;letter-spacing:2px}
.div .hd span{font-size:12.5px;opacity:.9}
.div.lib .hd{background:linear-gradient(0deg,#1E3A2A,#1E3A2A);border-bottom:3px solid #D9B45A}
.div.sul .hd{background:#5E7F4F;border-bottom:3px solid #B8892B}
.div .lider{background:#FFF6DC}
.div.br .hd{background:#2A4D38;border-bottom:3px solid #D9B45A}
.aviso{position:relative;padding-right:48px!important}
.segc button{font-size:12.5px;padding-left:4px;padding-right:4px;white-space:nowrap}
.xbtn{position:absolute;top:2px;right:2px;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--mu);font-size:16px;cursor:pointer;line-height:44px;padding:0}
.mt-r.zg{box-shadow:inset 4px 0 #D9B45A}.mt-r.zint{box-shadow:inset 4px 0 #5E7F4F}.mt-r.zmeio{box-shadow:inset 4px 0 #D8CBAA}.mt-r.zlan{box-shadow:inset 4px 0 #C9704A;background:#F7E1D5}
.mt-r.zg+.mt-r.zint,.mt-r.zint+.mt-r.zmeio,.mt-r.zmeio+.mt-r.zlan,.mt-r.zg+.mt-r.zmeio,.mt-r.zint+.mt-r.zlan,.mt-r.zg+.mt-r.zlan{border-top:2px dashed #CDBB8F}
.selos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.selo{display:flex;gap:8px;align-items:flex-start;background:var(--iv);border:1px solid var(--ln);border-left:4px solid var(--go);border-radius:12px;padding:8px 10px}
.selo.neg{border-left-color:var(--tc)}.selo .ic{font-size:24px;line-height:1}
.selo b{display:block;font-size:12px;font-family:Montserrat,sans-serif;letter-spacing:.5px;color:var(--gd)}.selo span{display:block;font-weight:700;font-size:14px}.selo small{color:var(--mu);font-size:12px}
.howto{background:#E9F0E4;border:1px solid #CADBC1;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;margin-bottom:12px;color:var(--tx)}
.mt-r{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--ln);cursor:pointer}
.mt-r:last-child{border-bottom:0}.mt-r:active{background:#F6EEDA}
.mt-p{font-family:Montserrat,sans-serif;font-weight:800;color:var(--mu);min-width:30px;font-size:15px}
.mt-r.lider .mt-p{color:var(--got)}
.mt-n{flex:1;min-width:0;display:flex;flex-direction:column}
.mt-n b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-c{font-size:12.5px;color:var(--gd);font-weight:700}
.mt-s{font-size:12px;color:var(--mu)}.mt-s em{color:var(--tc);font-style:normal;font-weight:700}
.mt-m{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.mt-m b{font-family:Montserrat,sans-serif;font-size:22px;color:var(--gd);line-height:1}
.mt-m span{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);font-weight:700}
.mt-go{color:var(--got);font-size:22px;font-weight:700}
.ex{background:var(--iv);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.ex-t{font-family:Montserrat,sans-serif;font-size:11px;letter-spacing:1.2px;font-weight:800;color:var(--gd);margin-bottom:6px}
.ex-l{display:flex;justify-content:space-between;padding:4px 0;font-size:14.5px;border-bottom:1px dotted var(--ln)}
.ex-l b{font-family:Montserrat,sans-serif;color:var(--gd)}.ex-l.neg b{color:var(--tc)}
.ex-l.tot{border-top:2px solid var(--gd);border-bottom:0;margin-top:4px;font-weight:700}
.ex-r{margin-top:8px;background:#F3E3B5;border-radius:10px;padding:10px;text-align:center;font-family:Montserrat,sans-serif;font-size:15px;color:var(--tx)}
.ex-r b{font-size:20px;color:var(--gd)}
.ex-c td,.ex-c th{font-size:12.5px}.ex-c .me{background:#FFF6DC;color:var(--gd);font-weight:800}
.ex-w{background:#F4ECD8;border-left:4px solid var(--go);border-radius:8px;padding:8px 10px;font-size:13.5px;line-height:1.4;margin:8px 0}
.mesbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mesbar .nm{flex:1;text-align:center;font-family:Cinzel,serif;font-size:20px;color:var(--gd)}
.falta{display:inline-block;font-size:11px;font-weight:700;color:#5E7F4F;background:#E5EFE1;border-radius:999px;padding:1px 7px;margin-top:3px}
.pc{background:var(--iv);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.pc .hd{display:flex;align-items:center;gap:10px}
.pc .pos{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Montserrat,sans-serif;font-weight:800;font-size:15px;background:#E9DEC4;color:var(--gd);flex:0 0 auto}
.pc .pos.g1{background:#B8892B;color:#fff}.pc .pos.g2{background:#9AA3A0;color:#fff}.pc .pos.g3{background:#A86B3C;color:#fff}
.pc .nm{font-weight:700;font-size:16.5px;line-height:1.15}
.pc .big{margin-left:auto;text-align:right;font-family:Montserrat,sans-serif;font-weight:800;font-size:26px;color:var(--gd);line-height:1}
.pc .big small{display:block;font-size:9.5px;letter-spacing:1px;color:var(--mu);font-weight:700;margin-top:3px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.sg div{background:#F4ECD8;border-radius:9px;padding:6px 4px;text-align:center}
.sg b{display:block;font-family:Montserrat,sans-serif;font-size:17px;line-height:1.1}
.sg span{font-size:10.5px;color:var(--mu);letter-spacing:.3px}
.sg .bad b{color:var(--tc)}
details.dt{margin-top:8px}
details.dt summary{font-size:13px;font-weight:700;color:var(--gd);cursor:pointer;padding:6px 0;list-style:none}
details.dt summary::-webkit-details-marker{display:none}
.dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13.5px;padding:4px 2px}
.dl .t{font-family:Montserrat,sans-serif;font-size:10.5px;letter-spacing:1.2px;font-weight:700;grid-column:1/-1;margin-top:8px}
.dl b{text-align:right}
</style>

const BATIDAS={

  lasq_preso:{nome:"Lasquinez preso",cat:"direta",pecasSF:2,esp:true,art:"11"},

const INFR={
  passar:{nome:"Passar com pedra na mão",ef:"derrota",art:"22",reg:true},
  gato:{nome:"Gato",ef:"derrota",art:"23",reg:true},
  fingir:{nome:"Fingir que não tem e jogar",ef:"derrota",art:"24"},
  fraude:{nome:"Fraude (esconder pedras/bucha)",ef:"derrota",art:"24-D"},
  colagem:{nome:"Colagem irregular",ef:"simples",art:"24-A",extra:"+ advertência",adv:true},
  esqueceu:{nome:"Esqueceu de jogar / “passei” errado",ef:"simples",art:"24-B"},
  sinais:{nome:"Sinais ao parceiro",ef:"simples",art:"24 §4"},
  sorteio:{nome:"Pedra marcada no sorteio",ef:"nenhum",art:"24-C",extra:"perde o sorteio"}
};
const EF_TXT={derrota:"Derrota imediata: 1 peça ao adversário",simples:"3 pontos ao adversário (fim da rodada)",nenhum:"Sem efeito no placar"};
const DECRETO=new Date("2026-11-18T00:00:00-03:00").getTime();
const PTS=[0,3,5];
const other=s=>s==="A"?"B":"A";

const _csMemo=new WeakMap();
function computeState(p){if(p&&typeof p==="object"){let r=_csMemo.get(p);if(!r){r=_computeState(p);_csMemo.set(p,r);}return r;}return _computeState(p);}
function _computeState(p){
  // Regras (18/11/2026, revisadas): peça ganha com vitória DIRETA (ou por infração) mantém os pontos;
  // peça ganha com vitória SIMPLES (5 pts + seca, ou decisiva 3×3 vencida na seca) zera o jogo.
  // p.regra==="v1": mesa encerrada antes da revisão, mantida como foi homologada.
  const st={A:{s:0,pecas:0},B:{s:0,pecas:0},decisiva:false,winner:null,trace:[]};
  const semFila=p.modo==="semfila";
  const peca=(side,n,zera)=>{st[side].pecas+=n;if(zera){st.A.s=0;st.B.s=0;}st.decisiva=false;if(!semFila)st.winner=side;};
  const simples=(side,forcado)=>{
    if(st.decisiva){peca(side,1,p.regra!=="v1");return p.regra==="v1"?"decisiva":"zera";}
    if(st[side].s>=2){peca(side,1,true);return "zera";}
    st[side].s+=1;
    if(forcado||(st.A.s===1&&st.B.s===1))st.decisiva=true;
    return null;
  };
  for(const ev of (p.eventos||[])){
    if(st.winner)break;
    let nota=null;
    if(ev.k==="batida"){
      const d=BATIDAS[ev.tipo];if(!d)continue;
      const side=d.adv?other(ev.lado):ev.lado;
      if(d.cat==="direta")peca(side,semFila?(d.pecasSF||1):1,false);
      else nota=simples(side,!!d.forcado);
    }else if(ev.k==="infr"){
      const d=INFR[ev.tipo];if(!d)continue;
      if(d.ef==="derrota")peca(other(ev.lado),semFila&&ev.tipo==="passar"?2:1,false);
      else if(d.ef==="simples")nota=simples(other(ev.lado),false);
    }
    st.trace.push({A:{...st.A},B:{...st.B},decisiva:st.decisiva,nota});
  }
  if(semFila&&p.status==="encerrada"&&st.A.pecas!==st.B.pecas)st.winner=st.A.pecas>st.B.pecas?"A":"B";
  st.buchaAs=(p.eventos||[]).filter(e=>e.k==="batida"||(e.k==="infr"&&INFR[e.tipo]&&INFR[e.tipo].ef!=="nenhum")).length===0||st.decisiva;
  return st;
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function enqueue(key,fn){queues[key]=(queues[key]||Promise.resolve()).then(fn).catch(e=>{toast(e&&e.code==="quota_exceeded"?"Limite de dados atingido.":e&&e.code==="permission-denied"?"O banco recusou essa gravação.":"Não foi possível salvar. Tente de novo.");console.error(e);});return queues[key];}
function offline(){return !navigator.onLine;}
function statusRede(){const sync=document.getElementById("sync");if(!sync||!db)return;

async function put(col,id,data){
  if(db&&offline()){db.collection(col).doc(id).set(data).catch(e=>console.error(e));return;}
  if(db){return enqueue(col+"/"+id,async()=>{try{await db.collection(col).doc(id).set(data);}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));await db.collection(col).doc(id).set(data);}else throw e;}});}
  mem[col][id]=data;refreshMem(col);
}
const APAGA_DE_VERDADE=["fila","duplas"];
let motivoAtual="";
async function del(col,id){
  if(db&&offline()){toast("Exclusão só com internet.");return;}
  if(db)return enqueue(col+"/"+id,()=>APAGA_DE_VERDADE.includes(col)?db.collection(col).doc(id).delete():db.collection(col).doc(id).update({excluido:true,excluidoEm:Date.now(),excluidoPor:"Presidente"+(autor()?" ("+autor()+")":""),excluidoMotivo:motivoAtual||""}));
  delete mem[col][id];refreshMem(col);
}
function refreshMem(col){cache[col]=Object.entries(mem[col]).map(([id,d])=>({id,...d}));sortCache(col);render();}
function sortCache(col){
  if(col==="avulsos")cache[col].sort((a,b)=>(b.t||0)-(a.t||0));
  else if(col==="fila")cache[col].sort((a,b)=>(a.t||0)-(b.t||0));
  else if(col==="partidas"||col==="campeonatos"||col==="lustrados")cache[col].sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0));
  else cache[col].sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt-BR"));
}
const byId=(col,id)=>cache[col].find(x=>x.id===id);

async function connect(){
  const sync=document.getElementById("sync");
  try{if(!window.firebase)throw new Error("sem firebase");firebase.initializeApp(firebaseConfig);db=firebase.firestore();try{await db.enablePersistence({synchronizeTabs:true});}catch(e){console.warn("persistência offline indisponível",e&&e.code);}
    try{firebase.auth().onAuthStateChanged(u=>{gUser=u;if(u&&u.email&&u.email===presEmail()){admin=true;try{sessionStorage.setItem("seospAdmin","1");}catch(e){}}render();});firebase.auth().getRedirectResult().catch(e=>console.warn(e));}catch(e){console.warn("auth indisponível",e);}}catch(e){db=null;sync.textContent="sem conexão (não salva)";render();return;}
  const timer=setTimeout(()=>{if(!live)sync.innerHTML=offline()?"📴 sem internet<br><small>lances salvos no celular</small>":"conectando…";},10000);
  const subs={jogadores:db.collection("jogadores"),duplas:db.collection("duplas"),partidas:db.collection("partidas").orderBy("criadoEm","desc"),campeonatos:db.collection("campeonatos").orderBy("criadoEm","desc"),fila:db.collection("fila"),avulsos:db.collection("avulsos").orderBy("t","desc"),lustrados:db.collection("lustrados").orderBy("criadoEm","desc")};
  for(const [col,q] of Object.entries(subs)){
    q.onSnapshot({includeMetadataChanges:true},snap=>{
      const mudou=snap.docChanges().length>0||!carregado[col];carregado[col]=true;
      if(mudou){const all=snap.docs.map(d=>({id:d.id,...d.data()}));cache[col]=all.filter(x=>!x.excluido);lixo[col]=all.filter(x=>x.excluido);sortCache(col);}
      const era=live;if(!snap.metadata.fromCache){live=true;clearTimeout(timer);}
      statusRede();
      if(mudou||era!==live)render();
    },err=>{clearTimeout(timer);sync.textContent=err&&err.code==="permission-denied"?"sem permissão no banco":"sem conexão";console.error(err);});
  }
}

const low=x=>(x||"").trim().toLowerCase();
function acharJogador(nome){const n=low(nome);return cache.jogadores.find(j=>low(j.nome)===n||(j.apelidos||[]).some(a=>low(a)===n));}
function rosterNomes(){const out=[];const add=n=>{if(n&&!out.some(x=>low(x)===low(n)))out.push(n);};for(const r of ROSTER){const j=acharJogador(r);add(j?j.nome:r);}for(const j of cache.jogadores)add(j.nome);return out;}
function nomesDupla(d){const n=[nomeJog(d.j1),nomeJog(d.j2)].filter(Boolean);return n.length?n.join(" & "):"sem jogadores";}
function dnFix(d,def){if(!d)return d;const n=(d.j1||d.j2)?nomesDupla(d):(d.nome||def);return n===d.nome?d:{...d,nome:n};}
function normalizar(){
  cache.partidas=cache.partidas.map(p=>{const a=dnFix(p.duplaA,"Dupla A"),b=dnFix(p.duplaB,"Dupla B");return a===p.duplaA&&b===p.duplaB?p:{...p,duplaA:a,duplaB:b};});
  cache.duplas=cache.duplas.map(d=>dnFix(d,d.nome));
  cache.campeonatos=cache.campeonatos.map(c=>{const ds=c.duplas.map(d=>dnFix(d,d.nome));return ds.every((d,i)=>d===c.duplas[i])?c:{...c,duplas:ds};});
}

function regrasProtegidas(email){return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function colOk(col) {
      return col in ['jogadores','duplas','partidas','campeonatos','fila','avulsos','lustrados'];
    }
    function presidente() {
      return request.auth != null && request.auth.token.email == '${email}'
             && request.auth.token.email_verified == true;
    }
    match /{col}/{id} {
      allow read: if colOk(col);
      allow create: if colOk(col) && request.resource.data.size() < 40
                    && !('excluido' in request.resource.data);
      allow update: if colOk(col) && request.resource.data.size() < 40
                    && (presidente()
                        || (!('excluido' in request.resource.data) && !('excluido' in resource.data)));
      allow delete: if col in ['fila','duplas'];
    }
  }
}`;}

function linhaPartida(p){
  const st=computeState(p);const ativa=p.status==="ativa";const parada=ativa&&horasParada(p)>=PARADA_H;

  const sc=L=>emPts?PTS[Math.min(st[L].s,2)]:st[L].pecas;
  const pill=st.winner&&!ativa?"":parada?`<span class="pill" style="background:#F2D9C9;color:var(--tc)">⚠ parada ${fmtParada(p)}</span>`:ativa?`<span class="pill" style="background:#DCE8DA;color:var(--gd)">● em jogo</span>`:`<span class="pill" style="background:#ECE4D2;color:var(--mu)">encerrada</span>`;
  const row=L=>{const w=st.winner===L;return `<div class="mc-row ${w?"win":""}"><span class="nm">${w?"🏆 ":""}${esc(nomeDuplaLonga(p["dupla"+L]))}</span><span class="sc">${sc(L)}</span></div>`;};
  return `<div class="mc" data-open="${p.id}">
  <div class="mc-top"><span>${fmtData(p.criadoEm).replace(",", " ·")}</span><span class="tag">${p.modo==="semfila"?"sem fila":"com fila"}${p.campId?" · torneio":""}</span>${pill}<span class="un">${emPts?"pontos":"peças"}</span></div>
  ${row("A")}${row("B")}</div>`;
}

  const [l,j]=o;const quem=j?nomeJog(j):p["dupla"+l].nome;const cor=l==="A"?"var(--gd)":"var(--tc)";

async function salvarLance(k,tipo){
  const p=byId("partidas",curPartida);if(!p)return;const o=opcoesEvento(p)[sheet.ji];if(!o)return;const [lado,jog]=o;
  closeSheet();const ev={k,tipo,lado,jog,t:Date.now(),por:autor()||"?"};
  await salvarPartida({...p,eventos:[...(p.eventos||[]),ev]});
  const d=k==="batida"?BATIDAS[tipo]:INFR[tipo];toast(`${d.nome} · ${jog?nomeJog(jog):p["dupla"+lado].nome}`);
}
async function salvarEvento(){
  const p=byId("partidas",curPartida);const s=sheet;if(!p||s.ji==null||!s.tipo)return;
  const jogs=opcoesEvento(p);if(!jogs[s.ji])return;
  const [lado,jog]=jogs[s.ji];
  const ev={k:s.t==="batida"?"batida":"infr",tipo:s.tipo,lado,jog,t:Date.now(),por:autor()||"?"};
  const eventos=[...(p.eventos||[]),ev];
  closeSheet();
  await salvarPartida({...p,eventos});
  const d=ev.k==="batida"?BATIDAS[ev.tipo]:INFR[ev.tipo];
  toast(`${d.nome} registrado.`);
}
const canon=o=>JSON.stringify(o,Object.keys(o||{}).sort());
async function salvarPartida(p){
  const st=computeState(p);
  const out={...p};delete out.id;
  out.vencedor=st.winner||null;
  out.placar={A:{s:st.A.s,pecas:st.A.pecas},B:{s:st.B.s,pecas:st.B.pecas}};
  const old=byId("partidas",p.id);
  if(!db||!old)return put("partidas",p.id,out);
  // Atualização atômica: só os lances novos/removidos são enviados (dois celulares na mesma mesa não se apagam)
  const FV=firebase.firestore.FieldValue;const kOld=new Set((old.eventos||[]).map(canon)),kNew=new Set((p.eventos||[]).map(canon));
  const add=(p.eventos||[]).filter(e=>!kOld.has(canon(e))),rem=(old.eventos||[]).filter(e=>!kNew.has(canon(e)));
  const dOld=new Set((old.desfeitos||[]).map(canon)),dAdd=(p.desfeitos||[]).filter(e=>!dOld.has(canon(e)));
  const campos={...out};delete campos.eventos;delete campos.desfeitos;
  if(add.length)campos.eventos=FV.arrayUnion(...add);
  if(dAdd.length)campos.desfeitos=FV.arrayUnion(...dAdd);
  const ref=db.collection("partidas").doc(p.id);
  const run=async()=>{if(rem.length)await ref.update({eventos:FV.arrayRemove(...rem)});await ref.update(campos);};
  if(offline()){run().catch(e=>console.error(e));return;}
  return enqueue("partidas/"+p.id,async()=>{try{await run();}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800));await run();}else throw e;}});
}

async function iniciar(){

  closeSheet();

  const nm=(a,b,def)=>[a,b].filter(Boolean).map(nomeJog).join(" & ")||def;
  const id=uid();
  const p={duplaA:{id:null,nome:nm(ids[0],ids[1],"Dupla A"),j1:ids[0],j2:ids[1]},duplaB:{id:null,nome:nm(ids[2],ids[3],"Dupla B"),j1:ids[2],j2:ids[3]},modo:s.modo==="semfila"?"semfila":"fila",status:"ativa",eventos:[],criadoEm:Date.now()};
  await put("partidas",id,{...p,vencedor:null,placar:null});
  for(const f of cache.fila.filter(f=>cheios.some(n=>low(n)===low(f.nome))))await del("fila",f.id);

}

/* ===================== RANKING ===================== */
function stats(ini=iniPeriodo(),fim=Infinity,modo=false){const soMesas=!!modo;
  const S={};const em=t=>(t||0)>=ini&&(t||0)<fim;const NADA={b:{},inf:{}};const get=id=>!id?Object.assign(NADA,{mesas:0,vitorias:0,derrotas:0,esp:0,infTot:0,adv:0}):S[id]||(S[id]={id,nome:nomeJog(id),mesas:0,vitorias:0,derrotas:0,b:{},inf:{},esp:0,infTot:0,adv:0,ass:0});
  for(const p of cache.partidas){
    const st=computeState(p);
    if(modo==="peca"&&(st.A.pecas+st.B.pecas)===0)continue;
    if(modo==="jogada"&&!(p.eventos||[]).length)continue;
    for(const j of [p.duplaA.j1,p.duplaA.j2,p.duplaB.j1,p.duplaB.j2])if(em(p.criadoEm))get(j).mesas++;
    if(st.winner&&em(p.criadoEm)){const d=p["dupla"+st.winner];get(d.j1).vitorias++;get(d.j2).vitorias++;const o=p["dupla"+other(st.winner)];get(o.j1).derrotas++;get(o.j2).derrotas++;}
    for(const e of p.eventos||[]){
      if(!em(e.t))continue;const x=get(e.jog);
      if(e.k==="batida"){x.b[e.tipo]=(x.b[e.tipo]||0)+1;if(BATIDAS[e.tipo]&&BATIDAS[e.tipo].esp)x.esp++;
        if(e.tipo!=="fechou_chorou"){const D=[p.duplaA,p.duplaB].find(d=>d.j1===e.jog||d.j2===e.jog);const par=D&&(D.j1===e.jog?D.j2:D.j1);if(par){const y=get(par);y.ass=(y.ass||0)+1;}}}
      else{x.inf[e.tipo]=(x.inf[e.tipo]||0)+1;x.infTot++;if(INFR[e.tipo]&&INFR[e.tipo].adv)x.adv++;}
    }
  }
  for(const a of cache.avulsos){
    if(soMesas||!em(a.t)||!a.jog)continue;const x=get(a.jog);
    if(a.k==="vitoria")x.vitorias++;
    else if(a.k==="batida"){x.b[a.tipo]=(x.b[a.tipo]||0)+1;if(BATIDAS[a.tipo]&&BATIDAS[a.tipo].esp)x.esp++;}
    else if(a.k==="infr"){x.inf[a.tipo]=(x.inf[a.tipo]||0)+1;x.infTot++;if(INFR[a.tipo]&&INFR[a.tipo].adv)x.adv++;}
  }
  for(const l of cache.lustrados){
    if(!em(l.criadoEm))continue;const st=lustState(l);
    (l.jogadores||[]).forEach((j,i)=>{if(!j)return;const x=get(j);x.lustPts=(x.lustPts||0)+st.tot[i];x.lustJ=(x.lustJ||0)+1;});
    if(l.status!=="ativa"&&st.lider!=null&&l.jogadores[st.lider]){const x=get(l.jogadores[st.lider]);x.lust=(x.lust||0)+1;}
  }
  for(const j of cache.jogadores)get(j.id);
  return Object.values(S).map(pontuar);
}
const PONTOS_BAT={lasquinez:2,lasq_preso:3,buchada:2,buch_dobrada:3,fechou_menor:2,folgando:2,forcado:1,seca:1,fechou_chorou:-1};
const PONTOS_INF={passar:-3,gato:-3,fingir:-3,fraude:-5,colagem:-2,esqueceu:-2,sinais:-2,sorteio:-1};
const PONTO_VIT=5; // vitória de mesa (era +3 até 20/11/2026; recalcula todo o histórico)
const PONTO_ASS=1; // assistência: parceiro de quem bateu (qualquer batida, exceto Fechou–Chorou)
const isEsp=t=>BATIDAS[t]&&(BATIDAS[t].cat==="direta"&&!BATIDAS[t].adv||BATIDAS[t].esp);
const isSec=t=>t==="seca"||t==="forcado";
function pontuar(x){let p=x.vitorias*PONTO_VIT+(x.ass||0)*PONTO_ASS;for(const[k,n]of Object.entries(x.b))p+=(PONTOS_BAT[k]||0)*n;for(const[k,n]of Object.entries(x.inf))p+=(PONTOS_INF[k]||0)*n;
  x.pts=p;x.espN=Object.entries(x.b).reduce((a,[k,n])=>a+(isEsp(k)?n:0),0);x.secN=Object.entries(x.b).reduce((a,[k,n])=>a+(isSec(k)?n:0),0);return x;}
const ordemCamp=(a,b)=>b.pts-a.pts||b.vitorias-a.vitorias||b.espN-a.espN||b.secN-a.secN||a.infTot-b.infTot||(a.derrotas||0)-(b.derrotas||0)||a.nome.localeCompare(b.nome,"pt-BR");
let rankAba="jog";
function iniPeriodo(){if(rankFiltro==="hoje"){const d=new Date();d.setHours(0,0,0,0);return d.getTime();}return rankFiltro==="decreto"?DECRETO:0;}
function statsDuplas(){
  const ini=iniPeriodo();const D={};
  for(const p of cache.partidas){if(p.criadoEm<ini)continue;const st=computeState(p);
    for(const L of ["A","B"]){const d=p["dupla"+L];if(!d.j1||!d.j2)continue;const ids=[d.j1,d.j2].sort();const k=ids.join("+");
      const x=D[k]||(D[k]={k,nome:ids.map(nomeJog).join(" & "),mesas:0,vitorias:0,derrotas:0,pecas:0,b:{},inf:{},infTot:0});
      x.mesas++;if(st.winner===L)x.vitorias++;else if(st.winner)x.derrotas++;x.pecas+=st[L].pecas;

function zonasBR(N){

  const g=Math.max(1,Math.round(N*0.4)),lt=Math.max(1,Math.round(N*0.2));let it=Math.round(N*0.2);if(g+it+lt>N)it=Math.max(0,N-g-lt);const me=N-g-it-lt;

function janelaMes(off){const d=new Date();const a=new Date(d.getFullYear(),d.getMonth()+off,1);const b=new Date(a.getFullYear(),a.getMonth()+1,1);return {ini:a.getTime(),fim:b.getTime(),nome:MESES[a.getMonth()]+" "+a.getFullYear(),mes:a.getMonth(),ano:a.getFullYear()};}
function confronto(grupo,w){

function tabelaMes(off){

      const g=lista.slice(i,j);if(g.length>1){const v=confronto(g,w);g.forEach(x=>x.cd=v[x.id]);g.sort((a,b)=>b.cd-a.cd||a.nome.localeCompare(b.nome,"pt-BR"));}

function motivoPos(a,b,tipo){ // por que a (acima) está à frente de b

  if(tipo==="br"&&a.pts!==b.pts)return `${esc(a.nome)} tem mais pontos no mês (${a.pts} contra ${b.pts}).`;
  const base=tipo==="br"?`os pontos são iguais (${a.pts})`:`a média é igual (${fmtMed(a.med)})`;
  const c=tipo==="br"?[["vitorias","mais vitórias"],["espN","mais batidas especiais"],["secN","mais batidas secas"]]:[["pts","mais pontos no mês"],["vitorias","mais vitórias"],["espN","mais batidas especiais"],["secN","mais batidas secas"]];
  for(const [k,t] of c)if(a[k]!==b[k])return `${base} e o desempate é por ${t}: ${a[k]} contra ${b[k]}.`;
  if(a.infTot!==b.infTot)return `${base} e o desempate é por menos infrações: ${a.infTot} contra ${b.infTot}.`;
  if(a.cd!=null&&a.cd!==b.cd)return `empate em tudo; ${esc(a.nome)} venceu mais mesas no confronto direto (${a.cd} contra ${b.cd}).`;
  return "empate total: dividem a posição.";
}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function roundRobin(ids){
  const L=[...ids];if(L.length%2)L.push(null);const n=L.length,jogos=[];
  for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){const a=L[i],b=L[n-1-i];if(a&&b)jogos.push({id:uid(),rodada:r+1,a,b,vencedor:null,partidaId:null});}L.splice(1,0,L.pop());}
  return jogos;
}
function faseMata(ids,fase){

  return jogos;
}

function avancarMata(c){
  if(c.formato!=="mata")return false;let mudou=false;
  for(;;){
    const max=Math.max(...c.jogos.map(j=>j.rodada));const fase=c.jogos.filter(j=>j.rodada===max);
    if(fase.some(j=>!j.vencedor))break;
    const venc=fase.map(j=>j.vencedor);
    if(venc.length===1){if(c.campeao!==venc[0]){c.campeao=venc[0];mudou=true;}break;}
    c.jogos.push(...faseMata(venc,max+1));mudou=true;
  }
  return mudou;
}
function nomeFase(c,r){if(c.formato!=="mata")return "Rodada "+r;const n=c.jogos.filter(j=>j.rodada===r).length;return n===1?"Final":n===2?"Semifinal":n<=4?"Quartas de final":"Fase "+r;}
function tabela(c){

    const p=byId("partidas",j.partidaId);if(p){const st=computeState(p);T[j.a].P+=st[p.duplaA.id===j.a?"A":"B"].pecas;T[j.b].P+=st[p.duplaA.id===j.b?"A":"B"].pecas;}}

}

async function jogarCamp(ref){

  const da=c.duplas.find(d=>d.id===j.a),dbb=c.duplas.find(d=>d.id===j.b);
  const id=uid();
  const p={duplaA:{id:da.id,nome:da.nome,j1:da.j1,j2:da.j2},duplaB:{id:dbb.id,nome:dbb.nome,j1:dbb.j1,j2:dbb.j2},modo:"fila",status:"ativa",eventos:[],criadoEm:Date.now(),campId:cid,jogoId:jid};
  await put("partidas",id,{...p,vencedor:null,placar:null});
  const c2={...c,jogos:c.jogos.map(x=>x.id===jid?{...x,partidaId:id}:x)};delete c2.id;
  await put("campeonatos",cid,c2);
  if(db&&!byId("partidas",id))cache.partidas.unshift({id,...p});
  curPartida=id;view="mesa";history.replaceState(null,"","#mesa");render();window.scrollTo(0,0);
}
async function registrarCamp(p,winner){

  const vid=p["dupla"+winner].id;
  const c2={...c,jogos:c.jogos.map(x=>x.id===p.jogoId?{...x,vencedor:vid,partidaId:p.id}:x)};delete c2.id;
  avancarMata(c2);
  if(c2.formato!=="mata"&&c2.jogos.every(x=>!x.b||x.vencedor)){const T=tabela({...c2});c2.campeao=T[0]?T[0].d.id:null;}
  await put("campeonatos",p.campId,c2);
}

/* ===================== LUSTRADO (individual, múltiplos de 5) ===================== */
function lustState(l){
  const n=(l.nomes||[]).length;const tot=Array(n).fill(0);
  const meta=l.meta||0;let bateu=-1;
  for(const e of l.eventos||[]){if(tot[e.i]==null)continue;tot[e.i]+=e.v;if(meta&&bateu<0&&tot[e.i]>=meta)bateu=e.i;}
  let lider=null;for(let i=0;i<n;i++)if(lider==null||tot[i]>tot[lider])lider=i;
  const empate=lider!=null&&tot.filter(x=>x===tot[lider]).length>1;
  return {tot,lider:empate&&bateu<0?null:(bateu>=0?bateu:lider),empate,bateu};
}

/* ===================== SELOS DO MÊS ===================== */
const listaNomes=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" e "+a[a.length-1];
function selosMes(off){
  const w=janelaMes(off);const L=stats(w.ini,w.fim,"jogada").filter(x=>x.mesas>0);const out=[];
  const top=(f,min=1)=>{const m=Math.max(0,...L.map(f));return m>=min?{m,quem:L.filter(x=>f(x)===m)}:null;};
  const buch=top(x=>(x.b.buchada||0)+(x.b.buch_dobrada||0));if(buch)out.push({ic:"👑",nome:"Rei da Buchada",quem:buch.quem,info:buch.m+" buchada(s)"});
  const elig=L.filter(x=>x.mesas>=SUL_MIN);if(elig.length){const mi=Math.min(...elig.map(x=>x.infTot));const g=elig.filter(x=>x.infTot===mi);const mj=Math.max(...g.map(x=>x.mesas));out.push({ic:"🧼",nome:"Mão Limpa",quem:g.filter(x=>x.mesas===mj),info:`${mi} infração(ões) em ${mj} mesas`});}
  // maior sequência de vitórias (mesas com peça, em ordem)
  const seq={},best={};const ms=cache.partidas.filter(p=>p.criadoEm>=w.ini&&p.criadoEm<w.fim).sort((a,b)=>a.criadoEm-b.criadoEm);
  for(const p of ms){const st=computeState(p);if(!st.winner)continue;for(const L2 of ["A","B"])for(const j of [p["dupla"+L2].j1,p["dupla"+L2].j2]){if(!j)continue;seq[j]=L2===st.winner?(seq[j]||0)+1:0;best[j]=Math.max(best[j]||0,seq[j]);}}
  const mb=Math.max(0,...Object.values(best));if(mb>=2)out.push({ic:"🔥",nome:"Maior Sequência",quem:Object.keys(best).filter(j=>best[j]===mb).map(j=>({id:j,nome:nomeJog(j)})),info:mb+" vitórias seguidas"});
  const gato=top(x=>x.inf.gato||0);if(gato)out.push({ic:"🐈",nome:"Gato do Mês",quem:gato.quem,info:gato.m+" gato(s)",neg:true});
  return out;
}

function shMerge(){
  const de=byId("jogadores",sheet.de);if(!de)return "";
  const outros=cache.jogadores.filter(j=>j.id!==de.id);
  return `<h3>JUNTAR JOGADORES</h3><p class="muted" style="margin:0 0 8px">Tudo de <b>${esc(de.nome)}</b> (mesas, batidas, infrações, lustrado, avulsos) passa para o jogador escolhido, e “${esc(de.nome)}” sai da lista.</p>
  <div class="opts">${outros.map(j=>`<button class="opt ${sheet.para===j.id?"sel":""}" data-mto="${j.id}"><b>${esc(j.nome)}</b></button>`).join("")}</div>
  <div class="row" style="margin-top:12px"><button class="btn ghost grow" data-act="fecharSheet">Cancelar</button><button class="btn tc grow" data-act="fazerMerge" ${sheet.para?"":"disabled"}>JUNTAR</button></div>`;
}
async function fazerMerge(){
  const de=sheet.de,para=sheet.para;if(!de||!para)return;closeSheet();
  const sw=id=>id===de?para:id;
  for(const p of cache.partidas){if(![p.duplaA.j1,p.duplaA.j2,p.duplaB.j1,p.duplaB.j2].includes(de)&&!(p.eventos||[]).some(e=>e.jog===de))continue;
    const q={...p,duplaA:{...p.duplaA,j1:sw(p.duplaA.j1),j2:sw(p.duplaA.j2)},duplaB:{...p.duplaB,j1:sw(p.duplaB.j1),j2:sw(p.duplaB.j2)},eventos:(p.eventos||[]).map(e=>({...e,jog:sw(e.jog)}))};delete q.id;await put("partidas",p.id,q);}
  for(const d of cache.duplas){if(d.j1!==de&&d.j2!==de)continue;const q={...d,j1:sw(d.j1),j2:sw(d.j2)};delete q.id;await put("duplas",d.id,q);}
  for(const a of cache.avulsos){if(a.jog!==de)continue;const q={...a,jog:para};delete q.id;await put("avulsos",a.id,q);}
  const np=nomeJog(para);
  for(const l of cache.lustrados){if(!(l.jogadores||[]).includes(de))continue;const q={...l,jogadores:l.jogadores.map(sw),nomes:l.nomes.map((n,i)=>l.jogadores[i]===de?np:n)};delete q.id;await put("lustrados",l.id,q);}
  for(const c of cache.campeonatos){if(!c.duplas.some(d=>d.j1===de||d.j2===de))continue;const q={...c,duplas:c.duplas.map(d=>({...d,j1:sw(d.j1),j2:sw(d.j2)}))};delete q.id;await put("campeonatos",c.id,q);}
  const dj=byId("jogadores",de),pj=byId("jogadores",para);
  if(dj&&pj){const ap=new Set([...(pj.apelidos||[]),...(dj.apelidos||[]),dj.nome].filter(a=>low(a)!==low(pj.nome)));const q={...pj,apelidos:[...ap]};delete q.id;await put("jogadores",para,q);}
  await del("jogadores",de);toast("Jogadores unidos em "+np+".");
}

  <details class="card rg"><summary>🔁 Sem fila (Art. 9º)</summary><div class="rules"><p>Sem ninguém esperando e sem “zerou”, conta-se em peças: Lasquinez 1, preso 2, Buchada 1, dobrada 2, Fechamento 1, Fechou–Chorou 2 (para o adversário), Folgando bucha 1. Vitórias simples seguem 3 → 5 → 1 peça. A mesa só termina quando alguém encerra; vence quem tiver mais peças.</p></div></details>

  <details class="card rg"><summary>✅ Boas práticas</summary><div class="rules"><p>Registre cada mesa de um celular por vez. Errou? Use “Desfazer último” (fica registrado). Casos omissos: maioria dos presentes, mínimo de 3 (Art. 26).</p></div></details>
  <h2>DOCUMENTOS OFICIAIS</h2><div class="card docs">
  <a class="doc" href="docs/lei-0608-2026.pdf" target="_blank" rel="noopener">📜 <span><b>Lei Municipal nº 0608/2026</b><small>Regulamento completo do Dominó SEOSP</small></span>›</a>
  <a class="doc" href="docs/decreto-001-2026.pdf" target="_blank" rel="noopener">⚖️ <span><b>Decreto nº 001/2026</b><small>Transição para 2027 e registro por jogador</small></span>›</a>
  <a class="doc" href="docs/card-regras.pdf" target="_blank" rel="noopener">🃏 <span><b>Card de regras da mesa</b><small>Resumo para imprimir</small></span>›</a>
  <a class="doc" href="docs/card-o-que-mudou.pdf" target="_blank" rel="noopener">🔄 <span><b>Card “O que mudou”</b><small>Mudanças da transição</small></span>›</a></div>
  <h2>TRANSPARÊNCIA</h2><div class="card">
  <p style="margin:0 0 8px">Cada lance fica registrado com <b>quem lançou e o horário</b>. Desfazer e excluir também ficam registrados, com o motivo.</p>
  <div class="row" style="align-items:center"><span class="grow">Este celular lança como: <b>${esc(autor()||"não identificado")}</b></span><button class="btn ghost sm" data-act="trocarAutor">${autor()?"Trocar":"Identificar"}</button></div>
  <details style="margin-top:10px"><summary style="font-weight:700;color:var(--gd);cursor:pointer">🗂 Histórico de exclusões e desfeitos (${historicoExclusoes().length})</summary>
  <div style="margin-top:8px">${(()=>{const H=historicoExclusoes().slice(0,60);return H.length?H.map(x=>`<div class="hx"><div><b>${esc(x.o)}</b></div>${x.ctx?`<div class="muted">${esc(x.ctx)}</div>`:""}<div class="muted" style="font-size:12px">${x.em?fmtData(x.em):""}${x.por?" · por "+esc(x.por):""}${x.lancou?" · lançado por "+esc(x.lancou):""}</div>${x.mot?`<div style="font-size:13px">Motivo: ${esc(x.mot)}</div>`:""}</div>`).join(""):`<p class="muted">Nada foi excluído ou desfeito.</p>`;})()}</div></details></div>
  <h2>INSTALAR NO CELULAR</h2><div class="card"><p style="margin:0 0 8px">${instalado()?"✔ O placar já está instalado neste celular.":"Instale o placar na tela inicial: abre como aplicativo e <b>funciona sem internet</b> (os lances ficam salvos e sobem quando a conexão voltar)."}</p>${instalado()?"":`<button class="btn gold sm" data-act="instalar">📲 Instalar app</button>`}</div>
  <h2>MODO PRESIDENTE</h2><div class="card">${admin?`<p style="margin:0 0 10px"><b>🔓 Ativo neste aparelho.</b> Aparecem os botões de excluir mesas, jogadas, lustrados, avulsos e torneios, e de juntar jogadores.</p><button class="btn ghost" data-act="adminSair">Sair do modo presidente</button><button class="btn gold sm" style="width:100%;margin-top:10px" data-act="backup">💾 Baixar backup completo (faça todo dia 1º)</button>
  <div class="gprot"><div class="ex-t">🔐 PROTEÇÃO COM GOOGLE</div>${gUser?`<p style="margin:4px 0">Conectado como <b>${esc(gUser.email)}</b>. ${presEmail()===gUser.email?"Este é o e-mail do Presidente.":""}</p><button class="btn ghost sm" data-act="sairGoogle">Desconectar Google</button>
  <details style="margin-top:8px"><summary style="font-weight:700;color:var(--gd);cursor:pointer">Passo a passo para ativar a proteção (uma vez)</summary><div class="rules" style="margin-top:6px">
  <p><b>1.</b> No Firebase (console.firebase.google.com) › projeto <b>domino-seosp</b> › <b>Authentication</b> › <b>Sign-in method</b> › ative <b>Google</b>.</p>
  <p><b>2.</b> Em <b>Authentication › Settings › Authorized domains</b>, adicione <b>jnnvld.github.io</b>.</p>
  <p><b>3.</b> Em <b>Firestore Database › Rules</b>, apague tudo, cole as regras abaixo e toque em <b>Publish</b>.</p>
  <button class="btn gold sm" data-act="copiarRegras">📋 Copiar regras com ${esc(gUser.email)}</button>
  <p class="muted" style="margin-top:8px">Depois disso, só quem entrar com este Google consegue excluir mesas, lançamentos, torneios e juntar jogadores. Lançar jogadas continua livre para todos.</p></div></details>`:`<p class="muted" style="margin:4px 0 8px">Entre com o seu Google para que as exclusões fiquem protegidas de verdade no banco de dados.</p><button class="btn sm" data-act="entrarGoogle">Entrar com Google</button>`}</div>`:`<p class="muted" style="margin:0 0 8px">Exclusão de resultados, só para a Presidência.</p><div class="row"><input type="password" inputmode="numeric" id="pin" aria-label="Senha do Presidente" placeholder="Senha" maxlength="12" class="grow" autocomplete="off"><button class="btn" data-act="adminEntrar">Entrar</button></div>`}</div>
  ${admin?`<h2>JOGADORES (CADASTRO)</h2><div class="card"><button class="btn sm" style="width:100%;margin-bottom:8px" data-act="novoJog">+ Novo jogador</button>${cache.jogadores.length?cache.jogadores.map(j=>`<div class="match"><div class="grow"><b>${esc(j.nome)}</b>${(j.apelidos||[]).length?`<div class="muted" style="font-size:12px">também: ${esc(j.apelidos.join(", "))}</div>`:""}</div><button class="btn ghost sm" data-ren="jogadores:${j.id}">Renomear</button><button class="btn ghost sm" data-merge="${j.id}">Juntar</button></div>`).join(""):`<div class="empty">Nenhum jogador.</div>`}<p class="muted" style="font-size:12.5px;margin:8px 0 0">Jogador novo também pode ser cadastrado por qualquer um na hora de montar a mesa.</p></div>`:""}`;
}

/* ===================== INÍCIO ===================== */
{const h=location.hash.slice(1);if(VIEWS.some(x=>x[0]===h))view=h;}
render();connect();
</script>
